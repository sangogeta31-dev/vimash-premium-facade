name: Dependency Security Updates

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: audit
        run: |
          npm audit --json > audit-results.json || true
          cat audit-results.json

      - name: Check for vulnerabilities
        run: |
          VULN_COUNT=$(node -e "const audit = require('./audit-results.json'); console.log(audit.metadata?.vulnerabilities?.total || 0)")
          echo "Total vulnerabilities found: $VULN_COUNT"

          if [ "$VULN_COUNT" -gt 0 ]; then
            echo "::warning::Found $VULN_COUNT vulnerabilities"
            npm audit
          fi

      - name: Run ESLint security check
        run: npm run lint
        continue-on-error: true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-results
          path: audit-results.json
          retention-days: 30

  dependabot-config:
    name: Verify Dependabot Config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Dependabot config
        run: |
          if [ ! -f .github/dependabot.yml ]; then
            echo "::warning::Dependabot configuration not found. Creating one..."
            mkdir -p .github
            cat > .github/dependabot.yml << 'EOF'
          version: 2
          updates:
            - package-ecosystem: "npm"
              directory: "/"
              schedule:
                interval: "weekly"
                day: "monday"
                time: "09:00"
              open-pull-requests-limit: 10
              reviewers:
                - "your-github-username"
              labels:
                - "dependencies"
                - "security"
              commit-message:
                prefix: "chore(deps)"
              groups:
                security:
                  patterns:
                    - "*"
                  update-types:
                    - "security"
          EOF
            echo "Created Dependabot config. Please commit this file."
          else
            echo "Dependabot configuration exists"
            cat .github/dependabot.yml
          fi

  notify:
    name: Notify on Issues
    runs-on: ubuntu-latest
    needs: [audit]
    if: failure()

    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔒 Security Audit Failed - Action Required';
            const body = `
            ## Security Audit Alert

            The weekly security audit has detected issues that require attention.

            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Next Steps
            1. Review the audit results artifact
            2. Update vulnerable dependencies using \`npm audit fix\`
            3. Test the application after updates
            4. Create a PR with the fixes

            ### Manual Commands
            \`\`\`bash
            # Check for vulnerabilities
            npm audit

            # Fix automatically (non-breaking)
            npm audit fix

            # Fix all (including breaking)
            npm audit fix --force

            # Review specific package
            npm why <package-name>
            \`\`\`

            **Auto-generated by:** Dependency Security Updates workflow
            `;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,automated'
            });

            const existingIssue = issues.data.find(issue => issue.title === title);

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'automated', 'dependencies']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `🔄 Security audit failed again on ${new Date().toISOString()}\n\nSee latest run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
              });
            }
